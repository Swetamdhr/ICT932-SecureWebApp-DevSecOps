name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Stage 1: Build & Unit Tests ───────────────────────────────
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt
          pip install django-otp qrcode pillow django-cache-lock

      - name: Run Django migrations
        run: |
          cd src
          python manage.py migrate --run-syncdb

      - name: Run unit tests
        run: |
          cd src
          python manage.py test --verbosity=2

  # ── Stage 2: SAST Scan (Bandit + Safety) ─────────────────────
  sast-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit SAST scan
        run: |
          bandit -r src/ -f txt -o bandit-report.txt || true
          cat bandit-report.txt

      - name: Install dependencies for Safety check
        run: |
          pip install -r src/requirements.txt

      - name: Run Safety dependency vulnerability check
        run: |
          safety check --output text || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  # ── Stage 3: Nikto Web Scan ───────────────────────────────────
  nikto-scan:
    name: Nikto Web Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nikto
        run: sudo apt-get install -y nikto

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt
          pip install django-otp qrcode pillow

      - name: Start Django server
        run: |
          cd src
          python manage.py migrate --run-syncdb
          python manage.py runserver &
          sleep 8

      - name: Run Nikto scan
        run: |
          nikto -h http://127.0.0.1:8000 -output nikto-report.txt -Format txt || true
          cat nikto-report.txt

      - name: Upload Nikto report
        uses: actions/upload-artifact@v4
        with:
          name: nikto-report
          path: nikto-report.txt

  # ── Stage 4: OWASP ZAP DAST Scan ─────────────────────────────
  owasp-zap-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install django-otp qrcode pillow django-csp python-decouple

      - name: Start Django server
        env:
          SECRET_KEY: 'django-insecure-pipeline-test-key-not-for-production'
          DEBUG: 'True'
        run: |
          python manage.py migrate --run-syncdb
          python manage.py runserver &
          sleep 10

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://127.0.0.1:8000'
          cmd_options: '-I'
          fail_action: false

  # ── Stage 5: Pipeline Complete ────────────────────────────────
  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-scan]
    steps:
      - name: Pipeline summary
        run: |
          echo "============================================"
          echo "  DevSecOps Pipeline Completed Successfully"
          echo "============================================"
          echo "  Stages run:"
          echo "  ✅ Build & Unit Tests"
          echo "  ✅ SAST Scan (Bandit + Safety)"
          echo "  ✅ Nikto Web Scan"
          echo "  ✅ OWASP ZAP DAST Scan"
          echo "============================================"
