<!DOCTYPE html>
<html>
<head>
    <title>Task Manager - Login</title>
</head>
<body>
    <h2>Secure Task Manager</h2>
    <h3>Login</h3>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <p>Username: <input type="text" name="username"></p>
        <p>Password: <input type="password" name="password"></p>
        <button type="submit">Login</button>
    </form>
</body>
</html>
